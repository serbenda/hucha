name: Sondeo temporal
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  igae:
    runs-on: ubuntu-latest
    steps:
      - name: Libros de agosto de 2026
        run: |
          B="https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadPublica/CPE/EjecucionPresupuestaria/Documents"
          UA="Mozilla/5.0 (hucha; github.com/serbenda/hucha)"
          cat > leer.js <<'JS'
          const { execFileSync } = require('child_process');
          const [fich, modo, hojaPedida] = process.argv.slice(2);
          const x = (p) => { try { return execFileSync('unzip', ['-p', fich, p], { encoding: 'utf8', maxBuffer: 1e9 }); } catch { return ''; } };
          const limpio = (t) => String(t ?? '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
          const ss = [...x('xl/sharedStrings.xml').matchAll(/<si>([\s\S]*?)<\/si>/g)].map((m) => limpio(m[1]));
          const libro = x('xl/workbook.xml');
          const rels = x('xl/_rels/workbook.xml.rels');
          const hojas = [...libro.matchAll(/<sheet [^>]*name="([^"]+)"[^>]*r:id="([^"]+)"/g)].map(([, nombre, rid]) => {
            const t = (rels.match(new RegExp('Id="' + rid + '"[^>]*Target="([^"]+)"')) || rels.match(new RegExp('Target="([^"]+)"[^>]*Id="' + rid + '"')) || [])[1];
            return { nombre, ruta: 'xl/' + String(t).replace(/^\/?xl\//, '') };
          });
          const celdas = (xml) => [...xml.matchAll(/<row [^>]*r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g)].map(([, r, fila]) => [...fila.matchAll(/<c r="([A-Z]+)\d+"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)].map(([, col, attrs, dentro]) => { const v = (dentro || '').match(/<v>([\s\S]*?)<\/v>/)?.[1]; return col + '=' + (/t="s"/.test(attrs) ? ss[+v] : v ?? ''); }).filter((c) => !c.endsWith('=')).join(' ; '));
          const nota = (t, m) => console.log('::notice title=' + t + '::' + m.replace(/[\r\n%]/g, ' ').slice(0, 3900));
          if (modo === 'lista') {
            const s = hojas.map((h) => { const f = celdas(x(h.ruta)); return h.nombre + ' [' + f.length + ']: ' + f.slice(0, 4).join(' / ').slice(0, 150); });
            for (let i = 0; i < s.length; i += 10) nota(fich + ' hojas ' + (i + 1) + '-' + Math.min(i + 10, s.length) + '/' + s.length, s.slice(i, i + 10).join(' ## '));
          } else {
            const h = hojas.find((h) => h.nombre === hojaPedida) ?? hojas[0];
            const f = celdas(x(h.ruta));
            for (let i = 0; i < Math.min(f.length, 60); i += 12) nota(fich + ' ' + h.nombre + ' filas ' + (i + 1), f.slice(i, i + 12).join(' || '));
          }
          JS
          for f in "MENSUAL AGOSTO 2026.xlsx" "MENSUAL AGOSTO 2026 ANEXO I.xlsx" "MENSUAL AGOSTO 2026 ANEXO II.xlsx"; do
            n=$(echo "$f" | tr ' ' '_')
            curl -sL -A "$UA" --max-time 120 "$B/$(echo "$f" | sed 's/ /%20/g')" -o "$n" -w "::notice title=$n::%{http_code} %{size_download}\n"
            node leer.js "$n" lista
          done
          node leer.js "MENSUAL_AGOSTO_2026_ANEXO_I.xlsx" filas
          node leer.js "MENSUAL_AGOSTO_2026_ANEXO_II.xlsx" filas

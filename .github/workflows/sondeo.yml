# TEMPORAL: sondeo de las fuentes de la Lupa. Se borra antes de fusionar.
name: Sondeo de fuentes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: BDNS
        run: node scripts/sondeo.mjs bdns
      - name: OCDE
        run: node scripts/sondeo.mjs oecd
      - name: Plataforma de Contratación
        run: node scripts/sondeo.mjs placsp

name: Sondeo temporal
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - name: Ficheros mensuales de la Plataforma de Contratación
        run: |
          for u in \
            https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3_202509.zip \
            https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3_202509.zip \
            https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_1044/PlataformasAgregadasSinMenores_202509.zip \
            https://contrataciondelestado.es/sindicacion/sindicacion_1044/PlataformasAgregadasSinMenores_202509.zip \
            https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3_2024.zip \
            https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_1044/PlataformasAgregadasSinMenores_2024.zip \
            https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3_202610.zip ; do
            r=$(curl -sIL --max-time 60 -o /dev/null -w '%{http_code} %{size_download} %{url_effective}' "$u"; echo)
            len=$(curl -sIL --max-time 60 "$u" | grep -i '^content-length' | tail -1 | tr -d '\r')
            echo "::notice::$r | $len"
          done
      - name: Dentro de un fichero mensual
        run: |
          u=https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3_202509.zip
          curl -sL --max-time 300 "$u" -o m.zip || curl -sL --max-time 300 "${u/contrataciondelsectorpublico.gob.es/contrataciondelestado.es}" -o m.zip
          ls -la m.zip; echo "::notice::zip $(stat -c %s m.zip) bytes"
          unzip -l m.zip | head -5 | sed 's/^/::notice::/'
          echo "::notice::ficheros $(unzip -l m.zip | tail -1)"
          f=$(unzip -Z1 m.zip | head -1); unzip -p m.zip "$f" | head -c 3000 | tr '\n' ' ' | cut -c1-1500 | sed 's/^/::notice::/'
          echo "::notice::entradas en el primero: $(unzip -p m.zip "$f" | grep -c '<entry>')"
          echo "::notice::total entradas: $(unzip -p m.zip | grep -c '<entry>')"
  crs:
    runs-on: ubuntu-latest
    steps:
      - name: OCDE CRS (ayuda por país y sector)
        run: |
          B="https://sdmx.oecd.org/dcd-public/rest/data/OECD.DCD.FSD,DSD_CRS@DF_CRS,1.7"
          Q="format=csvfilewithlabels&dimensionAtObservation=AllDimensions&startPeriod=2023&endPeriod=2023"
          i=0
          for k in "ESP.MAR.........." "ESP....._T._T....." "ESP..........."; do
            i=$((i+1))
            code=$(curl -s --max-time 900 -A "hucha (github.com/serbenda/hucha)" "$B/$k?$Q" -o d$i.csv -w "%{http_code} %{size_download}")
            node -e "
              const t=require('fs').readFileSync('d$i.csv','utf8').split(/\r?\n/).filter(Boolean);
              const split=(l)=>{const r=[];let c='',q=false;for(const ch of l){if(ch==='\"'){q=!q;continue}if(ch===','&&!q){r.push(c);c='';continue}c+=ch}r.push(c);return r};
              const h=split(t[0]||'');
              const filas=t.slice(1).map(split);
              const res=h.map((c,j)=>{const v=new Set(filas.map(f=>f[j]));return c+'('+v.size+'):'+[...v].slice(0,12).join('|')}).join(' ;; ');
              console.log('::notice title=CRS $k::http $code; filas '+filas.length+'; '+(filas.length?res.slice(0,3500):t.slice(0,3).join(' ').slice(0,400)));
            "
          done

name: Comprobar dominio
on:
  push:
    branches: [comprobar-dominio]
jobs:
  dominio:
    runs-on: ubuntu-latest
    steps:
      - name: DNS de bendi.dev y sus subdominios
        run: |
          for h in bendi.dev www.bendi.dev hucha.bendi.dev bolsillo.bendi.dev marquesina.bendi.dev atalaya.bendi.dev uptime.bendi.dev; do echo "== $h: $(dig +short $h CNAME | tr '\n' ' ') | A: $(dig +short $h A | tr '\n' ' ')"; done
          echo "== Respuesta completa de hucha.bendi.dev"; dig @1.1.1.1 hucha.bendi.dev A | grep -E "status|SOA|ANSWER"
          echo "== GitHub Pages sin dominio"; curl -sS -o /dev/null -w "%{http_code} -> %{redirect_url}\n" https://serbenda.github.io/hucha/ || true

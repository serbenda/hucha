name: Actualizar datos y publicar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Cada día: la Lupa reúne los contratos y subvenciones nuevos. Eurostat (gasto por funciones)
    # solo cambia unas pocas veces al año, pero mirarlo a diario no cuesta nada. Hora en UTC.
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      # Actions fijadas por commit para que no cambien sin que lo sepamos (versión en el comentario)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - id: pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Recuperar el almacén (los datos acumulados hasta ayer)
        # El almacén vive en la release «almacen» del repositorio, fuera de la web. Si aún no existe,
        # se recupera de la web publicada (como se hacía antes de tener almacén).
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.pages.outputs.base_url || 'https://hucha.bendi.dev' }}
        run: |
          mkdir -p almacen
          if gh release download almacen --repo "${{ github.repository }}" --dir almacen --clobber 2>/dev/null; then
            echo "::notice title=Almacén::recuperado de la release"
          else
            curl -fsSL --max-time 60 "$BASE/data/cofog.json" -o almacen/cofog.json || rm -f almacen/cofog.json
            for f in contratos subvenciones ayuda; do
              curl -fsSL --max-time 120 "$BASE/data/lupa/$f.json" -o "almacen/$f.json" || rm -f "almacen/$f.json"
            done
            echo "::notice title=Almacén::sin release todavía; recuperado de la web"
          fi
          ls -la almacen

      - name: Descargar datos (Eurostat)
        run: npm run datos

      - name: Lupa (contratos, subvenciones y ayuda a otros países)
        # Cada fuente es independiente; si una falla, se queda su versión anterior
        timeout-minutes: 30
        env:
          # En las PR basta con unas pocas páginas de contratos para comprobar que todo funciona
          LUPA_PAGINAS: ${{ github.event_name == 'pull_request' && '3' || '40' }}
          # Un fichero mensual del histórico por feed y ejecución, también en las PR para probarlo
          LUPA_MESES: '1'
        run: npm run lupa

      - name: Escaparate (lo que descarga la web, ya calculado)
        run: npm run escaparate

      - name: Comprobar que hay datos
        run: |
          test -s almacen/cofog.json || { echo "::error::No hay datos: ni Eurostat ni el almacén"; exit 1; }
          test -s data/vistas/portada.json || { echo "::error::No se ha preparado el escaparate"; exit 1; }
          node -e "const d=require('./almacen/cofog.json'); if (d.ejemplo) { console.log('::error::Son datos de ejemplo'); process.exit(1) } console.log('Años:', d.años.join(', '), '| provisionales:', d.provisionales.join(', ') || 'ninguno')"
          for f in almacen/*.json; do [ -e "$f" ] || continue; node -e "if (require('./$f').ejemplo) { console.log('::error::$f son datos de ejemplo'); process.exit(1) }"; done

      - name: Resumen de las partidas (para revisarlas en la PR)
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { partidas, ultimoAño, gastoPorPersona, reparto, detallePartida, tiposDeGasto, ultimoAñoTipos } from './assets/js/cofog.js';
            const d = JSON.parse(readFileSync('almacen/cofog.json', 'utf8'));
            const a = ultimoAño(d), pp = gastoPorPersona(d, a);
            const filas = partidas(d, a).map((p) => p.nombre + ': ' + (p.cuota * 100).toFixed(1) + ' %, ' + Math.round(p.cuota * pp) + ' €/hab');
            console.log('::notice title=Partidas ' + a + '::' + filas.join(' | '));
            const r = reparto(d, a).map((f) => f.nombre + ': ' + f.partes.map((p) => p.nombre + ' ' + Math.round(p.cuota * 100)).join('/'));
            console.log('::notice title=Quién gasta ' + a + '::' + r.join(' | '));
            for (const id of ['sanidad', 'educacion', 'administracion', 'economia', 'otras-sociales']) {
              const g = detallePartida(d, id, a).map((x) => x.nombre + ' ' + (x.cuota * 100).toFixed(0) + ' %');
              console.log('::notice title=En qué se va: ' + id + '::' + (g.join(' | ') || 'sin detalle'));
            }
            const at = ultimoAñoTipos(d);
            const t = at ? tiposDeGasto(d, 'TOTAL', at).map((x) => x.nombre + ' ' + (x.cuota * 100).toFixed(1) + ' %') : [];
            console.log('::notice title=Cómo se gasta ' + (at ?? '') + '::' + (t.join(' | ') || 'sin desglose por tipo'));
            const leer = (f) => { try { return JSON.parse(readFileSync('almacen/' + f + '.json', 'utf8')); } catch { return null; } };
            const c = leer('contratos'), s = leer('subvenciones'), y = leer('ayuda');
            const m = (n) => Math.round(n / 1e6) + ' M€';
            if (c) console.log('::notice title=Lupa contratos (' + c.contratos.length + ', desde ' + (c.desde ?? '?').slice(0, 10) + ')::' + c.contratos.slice(0, 8).map((x) => m(x.a) + ' ' + x.o + ' → ' + (x.g ?? []).join(', ') + ': ' + (x.t ?? '').slice(0, 70) + ' [' + (x.te ?? []).join(',') + ']').join(' | '));
            if (c) { const tren = c.contratos.filter((x) => x.te?.includes('tren')); console.log('::notice title=Lupa tren (' + tren.length + ')::' + tren.slice(0, 6).map((x) => m(x.a) + ' ' + x.o + ' (' + x.fi + '): ' + (x.t ?? '').slice(0, 70)).join(' | ')); }
            if (s) console.log('::notice title=Lupa subvenciones (' + s.subvenciones.length + ')::' + s.subvenciones.slice(0, 8).map((x) => m(x.i) + ' ' + x.o + ' → ' + x.b + ': ' + (x.c ?? '').slice(0, 60)).join(' | '));
            if (y) { const ult = y.años.at(-1); console.log('::notice title=Lupa ayuda ' + ult + '::' + Object.entries(y.paises).sort((a, b) => (b[1][ult] ?? 0) - (a[1][ult] ?? 0)).slice(0, 10).map(([p, v]) => p + ' ' + (v[ult] ?? 0)).join(' | ')); }
          "

      - name: Subir el almacén para guardarlo
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: almacen
          path: almacen/*.json
          retention-days: 3

      - name: Instalar herramientas (navegador de pruebas, axe y Lighthouse)
        run: |
          npm run herramientas
          npx playwright install --with-deps chromium

      - name: Fuente servida desde la web
        # Si falla, la web sigue funcionando con la fuente del sistema
        continue-on-error: true
        run: node scripts/vendor.mjs

      - name: Iconos e imagen para compartir (con los datos de ahora)
        run: node scripts/imagenes.mjs

      - name: Preparar la web
        run: |
          mkdir -p _site vendor
          cp -r index.html 404.html a-donde-va quien-gasta lupa fuentes assets data vendor \
            manifest.webmanifest sw.js sitemap.xml robots.txt .nojekyll _site/
          # Versión en los estilos y scripts de cada página, y en los módulos que importan entre sí:
          # al publicar, nadie mezcla HTML nuevo con CSS o JS viejos
          v="${GITHUB_SHA::8}"
          find _site -name '*.html' -exec sed -i -E "s#(href=\"[^\"]+\.css)\"#\1?v=$v\"#g; s#(src=\"[^\"]+\.js)\"#\1?v=$v\"#g" {} +
          sed -i -E "s#(from '\./[a-z0-9-]+\.js)'#\1?v=$v'#g" _site/assets/js/*.js
          grep -q "?v=$v" _site/assets/js/portada.js || { echo "::error::No se han versionado los imports"; exit 1; }
          test -f _site/vendor/fuentes/archivo-latin-wdth-normal.woff2 || echo "::warning::La fuente precargada ya no se llama archivo-latin-wdth-normal.woff2: actualiza el preload de las páginas"

      - name: Tests de navegador y accesibilidad (móvil y escritorio, claro y oscuro)
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log" || {
            # Los fallos salen como anotaciones en la PR, para verlos sin abrir el registro
            grep -E "^not ok|AssertionError|Error:|expected|actual|message:|^\s+[+-] " "$RUNNER_TEMP/e2e.log" | head -40 | sed 's/^/::error::/'
            exit 1
          }

      - name: Lighthouse (rendimiento, accesibilidad, buenas prácticas y SEO)
        env:
          # En main, un rendimiento bajo no impide publicar los datos del día (queda el aviso); en las PR, sí
          LH_RENDIMIENTO_AVISA: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: |
          set -o pipefail
          npm run lighthouse 2>&1 | tee "$RUNNER_TEMP/lh.log" || {
            grep -E "mínimo|Error" "$RUNNER_TEMP/lh.log" | head -20 | sed 's/^/::error::/'
            exit 1
          }

      - name: Capturas para el README
        # Si fallan no pasa nada: el README seguirá enseñando las anteriores
        continue-on-error: true
        run: npm run capturas

      - name: Estado de las fuentes
        if: always()
        run: |
          node -e "const e=require('./data/estado.json');for(const[k,v]of Object.entries(e))console.log((v.ok?'::notice::':'::warning::')+k+': '+v.detalle)" || true

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Subir el estado de las fuentes para el aviso
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: estado
          path: data/estado.json
          if-no-files-found: ignore

  guardar:
    # Guarda el almacén en la release «almacen», aunque la web no llegue a publicarse: los datos ya están
    # comprobados y así no se pierde lo acumulado. Es el único trabajo que puede escribir en el repositorio,
    # y solo en esa release (no crea commits).
    if: always() && github.event_name != 'pull_request'
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - id: bajar
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: almacen
          path: almacen

      - if: steps.bajar.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la almacen
          gh release view almacen --repo "$REPO" >/dev/null 2>&1 || \
            gh release create almacen --repo "$REPO" --prerelease --title "Almacén de datos" \
              --notes "Datos completos y acumulados de hucha (Eurostat y la Lupa). Los actualiza la Action cada día; la web publica solo lo que enseña cada página."
          gh release upload almacen almacen/*.json --repo "$REPO" --clobber

  publicar:
    # En las PR solo se construye y se prueba; se publica desde main
    if: github.event_name != 'pull_request'
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  avisar:
    # Abre un issue si falla una fuente, los tests, Lighthouse o la publicación, y lo cierra al recuperarse
    if: always() && github.event_name != 'pull_request'
    needs: [construir, publicar]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: estado

      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RESULTADO_CONSTRUIR: ${{ needs.construir.result }}
          RESULTADO_PUBLICAR: ${{ needs.publicar.result }}
        with:
          script: |
            const fs = require('fs');
            let estado = {};
            try { estado = JSON.parse(fs.readFileSync('estado.json', 'utf8')); } catch {}
            const fallos = Object.entries(estado).filter(([, e]) => !e.ok).map(([f, e]) => `- **${f}**: ${e.detalle}`);
            if (process.env.RESULTADO_CONSTRUIR !== 'success') fallos.push('- **construcción o tests**: la web no se ha podido preparar o no ha pasado los tests');
            else if (process.env.RESULTADO_PUBLICAR !== 'success') fallos.push('- **publicación**: GitHub Pages no ha aceptado la nueva versión');

            const { owner, repo } = context.repo;
            const abiertos = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'datos' })).data;
            const ejecucion = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            if (fallos.length) {
              const cuerpo = `${fallos.join('\n')}\n\n[Ver ejecución](${ejecucion})`;
              if (abiertos.length) {
                await github.rest.issues.createComment({ owner, repo, issue_number: abiertos[0].number, body: `Sigue fallando:\n\n${cuerpo}` });
              } else {
                const publicada = process.env.RESULTADO_PUBLICAR === 'success';
                await github.rest.issues.create({ owner, repo, title: publicada ? 'Algo que revisar en la web' : 'Fallo al actualizar la web', labels: ['datos'], body: `${publicada ? 'La web se ha publicado con los datos nuevos, pero hay algo que revisar.' : 'La web sigue con la última versión buena.'}\n\n${cuerpo}` });
              }
              core.warning(fallos.join(' | '));
            } else {
              for (const i of abiertos) {
                await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: `Resuelto: todo vuelve a funcionar. [Ver ejecución](${ejecucion})` });
                await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
              }
            }
